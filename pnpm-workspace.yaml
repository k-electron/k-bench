allowBuilds:
  node-pty: true

# A release has to be at least 3 days old (in minutes) before pnpm will resolve it, so a freshly
# published, possibly compromised version can't reach this repo's lockfile before it's been noticed.
minimumReleaseAge: 4320

# The Agent SDK (a dev dependency, used only by the tests) ships its own copy of Claude Code as
# optional per-platform packages, about 340 MB each. Tests always point it at the fake `claude`,
# so none of them is needed.
ignoredOptionalDependencies:
  - "@anthropic-ai/claude-agent-sdk-*"
