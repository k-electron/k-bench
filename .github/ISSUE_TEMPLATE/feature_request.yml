name: Feature request
description: Suggest something k-bench should do
labels: [needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please do not include your real hostname, tailnet name, login or email.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or the workflow, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like k-bench to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried or considered instead?
